name: CI

# Runs on every push and pull request. Nothing here needs a cloud account or
# a secret, so it works on forks and keeps working after a Snowflake trial
# ends. GitHub Actions is free for public repositories.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Unit tests
        run: pytest

  dbt:
    name: dbt build and tests (Snowflake emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Install dbt packages
        working-directory: dbt
        run: dbt deps
        env:
          DBT_PROFILES_DIR: .
          DBT_TARGET: ci
      # Seeds synthetic raw data into a local emulator, builds every model,
      # runs every data and unit test, then re-loads a day and builds again to
      # prove a re-run does not duplicate rows.
      - name: Build and test all models
        run: python scripts/dbt_emulator.py

  airflow:
    name: DAG integrity (Airflow 3)
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: "3.3.2"
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Airflow must be installed against its constraints file, or pip will
      # happily pick dependency versions it was never tested with.
      - name: Install Airflow
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" apache-airflow-providers-standard pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.12.txt"
      - name: Load the DAG and check its wiring
        run: pytest tests/dags

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build the images
        run: docker compose build
