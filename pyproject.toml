[project]
name = "wa-air-quality-elt"
version = "0.1.0"
description = "Daily batch ELT pipeline for Washington State air quality data."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/dbt_packages", "dbt/target", "logs"]
# Where first-party modules live, so imports sort into the right group.
src = [".", "dashboard"]

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes, I: import order, UP: modern syntax,
# B: likely bugs, SIM: simplifications.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
